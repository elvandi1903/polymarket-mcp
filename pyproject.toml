[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-mcp"
version = "0.1.0"
description = "MCP server exposing Polymarket CLOB trading (read + order) via the official unified polymarket-client SDK. Read-only by default; live orders require an explicit two-factor gate."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "mcp>=2,<3",
    "polymarket-client==0.20.1",
    "eth-account",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
polymarket-mcp = "polymarket_mcp.server:main"
polymarket-settlement-watcher = "polymarket_mcp.settlement_watcher:main"

[tool.setuptools.packages.find]
include = ["polymarket_mcp*"]

[tool.ruff.lint.per-file-ignores]
"polymarket_mcp/credentials.py" = ["BLE001"]
"polymarket_mcp/live.py" = ["BLE001", "S110"]
"polymarket_mcp/market_data.py" = ["BLE001"]
"polymarket_mcp/orders.py" = ["BLE001"]
"polymarket_mcp/ptb.py" = ["BLE001"]
"polymarket_mcp/round_streams.py" = ["BLE001"]
"polymarket_mcp/server.py" = ["BLE001", "S110"]
"polymarket_mcp/settlement_watcher.py" = ["BLE001"]
"tests/test_leak.py" = ["BLE001"]
"trade_check.py" = ["BLE001", "S110"]
